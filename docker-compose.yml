version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fujikyu_nexus_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-fujikyu_nexus}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fujikyu_nexus}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fujikyu_nexus_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-nexus_password_2026}@db:5432/${POSTGRES_DB:-fujikyu_nexus}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-fujikyu_nexus_enterprise_production_key_2026}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    volumes:
      - ./data_incoming:/app/data_incoming
      - ./data_processed:/app/data_processed
      - ./reports:/app/reports

volumes:
  pgdata:
